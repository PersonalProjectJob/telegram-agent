[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nailblog"
version = "0.1.0"
description = "Independent NailHub blog creation service"
requires-python = ">=3.11"
dependencies = ["telethon>=1.45,<2", "playwright>=1.48,<2", "Pillow>=10", "tzdata"]

[tool.setuptools.packages.find]
where = ["src"]
