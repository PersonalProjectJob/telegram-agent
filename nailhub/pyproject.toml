[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nailhub"
version = "1.0.0"
description = "Independent NailHub moderation service"
requires-python = ">=3.11"
dependencies = ["telethon>=1.45,<2", "playwright>=1.48,<2"]

[tool.setuptools.packages.find]
where = ["src"]
