mode = "dry-run"

[telegram]
ignored_command_prefixes = ["/nailhub"] # Other service commands are ignored before storage/triage.
session_path = "/var/lib/agentfleet/tg/gateway.session"
chat_ids = [-1001234567890]
# true = listen to every group/supergroup (not private chats/channels); chat_ids must then be empty or omitted
listen_all_groups = false
# Kept for compatibility; no longer used to drop short messages (the model judges them, 12.12).
min_text_length = 8

[telegram.proxy]
host = ""
port = 443

# Model server address and the confidence below which a model answer is not trusted as a ticket.
# Issue rules (Assistant definition 12.13): a /command with content or a Telegram tag always makes an issue;
# a bug, task or feedback the model is sure about (confidence >= the threshold) makes one without any tag;
# a question (or /question) and plain chat make none; an unsure untagged group waits as pending_review.
[ollama]
url = "http://127.0.0.1:11434"
confidence_threshold = 0.7

# The model that judges chat / bug / task / feedback (Assistant definition 12.12).
# provider = "ollama" is the only one supported now; "claude" is refused with a ConfigError until it is built.
# think = true turns the model's reasoning on; the reasoning is never logged or put in an issue.
# timeout_seconds must be long enough for reasoning on a CPU-only machine (default 600): measure it on the
# real host before fixing the final value. `model` / `timeout_seconds` under [ollama] (older layout) are
# still read when absent here.
[model]
provider = "ollama"
model = "qwen3.5:9b"
think = true
timeout_seconds = 600

[github]
max_issues_per_hour = 20

# Case aggregation (Assistant definition 12.1): one case = one GitHub issue.
# A reply joins the case of the replied message; otherwise the same sender (including a
# forward) within window_minutes of the case's last message. Commands (/bug ...) never wait.
# window_minutes = 0 disables waiting: every message becomes its own case.
# Topic split (Assistant definition 12.9): when a window closes, the model splits it into topics and
# every ticket / needs-human topic becomes its own issue holding only its own messages. A window longer
# than max_messages_per_window is cut into consecutive chunks of at most that many messages; each chunk
# is sent to the model and verified on its own (every message id exactly once, otherwise one retry and
# then ONE needs-human ticket for the chunk). Only effective when max_messages_per_case is larger.
[aggregation]
window_minutes = 2
max_messages_per_case = 20
max_messages_per_window = 40

# Image attachments (Assistant definition 12.8): JPG/PNG/WEBP are uploaded with `gh release upload`
# to release tag attachments-<case_key>. Images land in the target repo (public repo = public
# images): confirm the repo is private first. max_per_case = 0 turns image upload off.
# Documents (Assistant definition 12.14) use the same release and the same max_bytes (per file) and
# max_per_hour (every `gh release upload`, images and documents together). max_documents_per_case is
# counted separately from max_per_case; 0 turns document upload off.
# The accepted document types are FIXED IN CODE and cannot be configured here: pdf, docx, xlsx, pptx,
# txt, csv, md, json, html, zip. The type is read from the file name and the MIME, and both must agree.
# Executable/script types (exe, bat, cmd, sh, ps1, msi, apk, js, vbs, jar, dll, scr, com, app, dmg,
# reg, lnk, php, py) and every other extension are refused. Files are never opened or run.
[attachments]
max_bytes = 10485760
max_per_case = 5
max_per_hour = 60
max_documents_per_case = 5

[storage]
db_path = "/var/lib/agentfleet/tg/triage.sqlite3"
