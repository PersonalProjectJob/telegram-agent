# Copy to /etc/nailblog/nailblog.toml; NAILBLOG_CONFIG overrides the default.
# No API key ever goes in this file: only paths to mode-0600 key files.
[telegram]
session = "/var/lib/agentfleet/nailblog/nailblog.session"
# TG_API_ID and TG_API_HASH are supplied only through the service environment.

[service]
mode = "preview"                      # preview never writes to the website; live needs a verified contract.
db_path = "/var/lib/agentfleet/nailblog/nailblog.sqlite3"
owner_username = "SotaThao"
owner_ids = []                        # REQUIRED: exactly one numeric ID; loading fails until you fill it in.
timezone = "Asia/Ho_Chi_Minh"
slots = ["06:00", "10:00", "15:00", "19:00"]   # Agy-only schedule: 4 slots/day
late_window_minutes = 15

[schedule]
image_mode = "fixed"                  # fixed | random | adaptive
fixed_at = "01:00"
window_start_hours = 24
window_end_hours = 3
approve_deadline_hours = 2

[text_model]
provider = "agy"                      # only "agy" (subscription worker); removed keys (url, key_file, ...) are refused.
model = "qwen3.5:9b"                  # label only; the Agy worker picks the real model.
timeout_seconds = 900

[image]
provider = "subscription"             # only "subscription" (Agy worker, no API key).
candidates = 2                        # live mode needs candidates = 1 and max_rounds = 1.
max_rounds = 2
timeout_seconds = 180
review_bypass = false                 # TEMPORARY Owner decision: true skips the model image review (deterministic gates + both Owner approvals stay). See nailblog/AGENTS.md.

[sources]
# RSS/Atom feeds read by plan-week: https only, at most 30, at most 2 MB each. Add only feeds you have checked.
# A feed that fails is skipped and named in the topics DM; the published-post list comes from [contract] api_origin.
feeds = []
timeout_seconds = 15

[budget]
# The old API spend ledger is read-only history. Only its path is configured.
# ledger_db_path = "/var/lib/agentfleet/nailblog/ledger/nailblog-ledger.sqlite3"  # absolute; required when [autoflow] is enabled.

[contract]
environment = "production"           # Phase 2 build/test: set staging AND use the staging origins below.
media_origin = "https://vlink-storages-prod.sgp1.cdn.digitaloceanspaces.com" # Observed 2026-10-19; bind into authenticated verification report.
api_origin = "https://api.nailhub.ai"
site_origin = "https://nailhub.ai"
# staging pair: https://api-staging.nailhub.ai + https://staging.nailhub.ai
# All [links] must follow the selected site_origin. Never mix environments.
verified = false
verification_ref = ""                 # Required with verified=true before live.

[admin]
# Environment-bound login/probe work without enabling live or image generation.
# credential_file = "/etc/nailblog/private/staging-admin.json"  # {email,password}, service-owned 0600.
# profile_path = "/var/lib/agentfleet/nailblog-staging/browser" # Separate from all production/service profiles.
timeout_seconds = 30
headless = true
# daily_publish_limit = 1             # 1..number of service.slots, at most 4.
# create_timeout_seconds = 90         # 15..300, one admin create call.
# publish_timeout_seconds = 300       # 60..900, per article.
# [admin.category_ids]                # category slug -> GUID observed from the selected admin environment; all 4 are needed for [autoflow].
# hot-trend = "00000000-0000-0000-0000-000000000000"
# nail-job = "00000000-0000-0000-0000-000000000000"
# nail-salon = "00000000-0000-0000-0000-000000000000"
# did-you-know = "00000000-0000-0000-0000-000000000000"

[console]
revision = ""

[trends]
# Google Trending RSS, geo US only (TD-8). The host is pinned; this is the only URL accepted.
rss_url = "https://trends.google.com/trending/rss?geo=US"
poll_hours = 3                        # snapshot every N hours (Vietnam clock: 00:00, 03:00, ...).
# Watched nail keywords: their trend score uses the daily frequency kept in trend_snapshots.
keywords = ["chrome nails", "cat eye nails", "velvet nails", "burgundy nails", "chocolate nails", "french tip nails",
            "halloween nails", "christmas nails", "thanksgiving nails", "winter nails", "glitter nails", "gel x",
            "builder gel", "nail art", "short nails", "almond nails", "square nails", "coffin nails", "aura nails",
            "jelly nails"]
# A Google trending item (or news title) is relevant only when it holds an anchor word, as a whole word in any case.
anchor_terms = ["nail", "nails", "manicure", "pedicure", "mani", "pedi", "nail art", "nail salon", "nail polish",
                "nail tech"]
# Context words never make an item relevant; they only label an item that already matched an anchor.
context_terms = ["polish", "gel", "acrylic", "chrome", "french tip", "cat eye", "salon", "beauty", "makeup", "glitter"]
api_enabled = false                   # Official Google Trends API (alpha): not implemented, true is refused.

[daily]
# Vietnam time. propose_at < pick_deadline < preview_at.
propose_at = "10:00"                  # trend table + 4 candidates for tomorrow (2 per slot).
pick_deadline = "13:00"               # /nailblog pick <06|19> <n> until here; then backlog or best candidate.
preview_at = "20:00"                  # DM with tomorrow's articles to approve.
# slot_categories: keys must equal service.slots. These are the defaults for the four slots.
# [daily.slot_categories]
# "06:00" = ["hot-trend", "nail-job"]
# "10:00" = ["did-you-know", "hot-trend"]
# "15:00" = ["nail-salon", "nail-job"]
# "19:00" = ["nail-salon", "did-you-know"]

[links]
# Internal CTA targets of an article (https, nailhub.ai only). TODO Phase 0: the real URLs are not fixed yet.
jobs = "https://nailhub.ai/"          # cta.target = jobs: see job posts
salon_sale = "https://nailhub.ai/"    # cta.target = salon_sale: see salons for sale
app = "https://nailhub.ai/"           # cta.target = app: get the app

[autoflow]
# Unattended daily flow. enabled = true needs service.mode = live, image.provider = "subscription",
# text_model.provider = "agy", all four [admin.category_ids], contract.environment = "staging",
# an absolute budget.ledger_db_path, and admin.daily_publish_limit >= the number of service.slots.
enabled = false
# runs_dir = "/var/lib/agentfleet/nailblog/runs"   # absolute; required when enabled.

[subscription]
# Agy CLI subscription worker for text AND images. No API fallback or API key.
# Live mode needs staging + review_bypass + candidates/max_rounds = 1. Native CLI cover1376x768/body1200x675; no upscaling.
executable = "/snap/bin/agy"
version = "1.2.11"
agent_model = "gemini-3.8-flash-medium"
effort = "medium"
queue_dir = "/var/lib/nailblog-subscription/queue"
private_dir = "/home/startechai/snap/antigravity-cli/common/nailblog-worker"
worker_user = "startechai"
producer_user = "tgnailblog"
timeout_seconds = 240
text_agent = "nailblog-text-only"     # agent policy name used for text jobs
text_timeout_seconds = 600            # 120..900, per text job
max_daily_jobs = 48                   # 1..48
max_images_per_run = 12               # <=6 positions + ONE explicit Owner rejection retry; never automatic retry
