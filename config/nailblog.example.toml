# Copy to /etc/nailblog/nailblog.toml; NAILBLOG_CONFIG overrides the default.
# No API key ever goes in this file: only paths to mode-0600 key files.
[telegram]
session = "/var/lib/agentfleet/nailblog/nailblog.session"
# TG_API_ID and TG_API_HASH are supplied only through the service environment.

[service]
mode = "preview"                      # preview never writes to the website; live needs a verified contract.
db_path = "/var/lib/agentfleet/nailblog/nailblog.sqlite3"
owner_username = "SotaThao"
owner_ids = []                        # REQUIRED: exactly one numeric ID; loading fails until you fill it in.
timezone = "Asia/Ho_Chi_Minh"
slots = ["06:00", "19:00"]
late_window_minutes = 15

[schedule]
image_mode = "fixed"                  # fixed | random | adaptive
fixed_at = "01:00"
window_start_hours = 24
window_end_hours = 3
approve_deadline_hours = 2

[text_model]
provider = "ollama"                   # ollama | deepseek | gemini
model = "qwen3.5:9b"
url = "http://127.0.0.1:11434"        # Ollama must be on localhost.
think = false                         # Must stay false.
num_predict = 3000                    # Upper bound of output tokens per call (writer/planner pass smaller limits).
timeout_seconds = 900                 # Per call; a CPU-only local model is slow, the writer calls it once per section.
# key_file = "/etc/nailblog/private/model-key.json"   # Required for deepseek and gemini (scoped JSON, scope "gemini|https://generativelanguage.googleapis.com").
# provider = "gemini" also needs model (for example a Flash model) and a price entry in [budget.text_prices] (0.0 on the free tier).
section_thinking = "low"              # gemini only: thinking level of the section and repair calls; "" = provider default.

[image]
provider = "gemini"                   # gemini | openai (reserved) | cloudflare (explicit Free-only CLI)
model_body = ""                       # Pick from ListModels; required in live mode.
model_cover = ""
review_model = ""
# key_file = "/etc/nailblog/private/image-key.json"   # Required in live mode when key_source = "file".
key_source = "file"                   # file | env. env: the Gemini key is read once from the NAILBLOG_GEMINI_IMAGE_KEY service variable (never put here); live then needs no key_file.
candidates = 2
max_rounds = 2
cover_size = "2K"
body_size = "1K"
input_ceiling = 4096
output_ceiling = 2048                 # Entire cover candidate, INCLUDING image and thinking tokens.
body_output_ceiling = 1536            # Entire body candidate. Truncation holds the reservation.
review_input_ceiling = 16384
review_output_ceiling = 1024
timeout_seconds = 180
review_bypass = false                 # TEMPORARY Owner decision: true skips the model image review (deterministic gates + both Owner approvals stay). See nailblog/AGENTS.md.
# Local generation is ONLY explicit: images --article FILE --out DIR --run-id STABLE --run-usd APPROVED --paid-enabled.
# This command does not upload/publish or enable preview/daily image calls. Reuse the SAME run-id on resume.

[sources]
# RSS/Atom feeds read by plan-week: https only, at most 30, at most 2 MB each. Add only feeds you have checked.
# A feed that fails is skipped and named in the topics DM; the published-post list comes from [contract] api_origin.
feeds = []
timeout_seconds = 15

[budget]
daily_usd = 3.0
# ledger_db_path = "/var/lib/agentfleet/nailblog/ledger/nailblog-ledger.sqlite3"  # absolute; ONE paid-spend ledger for every state root.
# Required when [autoflow] is enabled. Every config that points at it must use the SAME daily_usd (the cap is read from the
# config of the process that reserves). Unset = the ledger lives in service.db_path as before.
# Prices are USD per 1M tokens (text) or USD per image. Ollama is free; every other model needs a price.
# [budget.text_prices."deepseek-chat"]
# input_per_m = 0.0
# output_per_m = 0.0
# [budget.image_prices]
# "your-image-model" = 0.0
# Real images require positive [budget.text_prices."configured-image-model"] input/output token rates,
# positive reviewer text prices, and the conservative maximum USD/1M generation output rate below.
# Every image/text/thinking output token is reserved at that maximum rate, not a rounded per-image estimate.
# [budget.image_output_prices]
# "configured-image-model" = 60.0      # Example ONLY: verify current provider pricing before enabling paid calls.
# [autoflow] needs a per-image USD price for model_cover@cover_size and model_body@body_size (sizes 1K / 2K / 4K):
# [budget.image_unit_prices."configured-image-model"]
# "1K" = 0.0    # Example ONLY: replace with the verified provider price.
# "2K" = 0.0

[cloudflare]
# Cloudflare image.model_cover/model_body must be "@cf/black-forest-labs/flux-2-klein-4b";
# image.review_model must be "@cf/qwen/qwen3.8-27b"; same account-bound scoped key_file for both.
# key JSON scope: cloudflare|https://api.cloudflare.com|ACCOUNT, key value outside Git only.
account_id = ""
# free_proof_file = "/etc/nailblog/private/cloudflare-free-proof.json"
# quota_db_path = "/var/lib/agentfleet/nailblog-cloudflare-quota/neurons.sqlite3" # ONE shared path per account.
daily_neurons = 10000.0
review_input_allowance = 32768         # Estimated allocation, NOT a verified vision token count.
# Optional local geometry aid (not an accepted final image): path and expected source SHA256 are required together.
# reference_image_file = "/var/lib/agentfleet/nailblog/reference/single-ended-nail-stick.png"
# reference_image_sha256 = "<64 lowercase hex characters>"
# Adapter downsizes to <=510px, binds source/processed hashes, and adds 5.37 neurons per input-image tile.
# images --article FILE --out DIR --run-id STABLE --free-enabled --run-neurons 9000
# Fresh proof <=1h: account_id, plan="Workers Free", observed_at/expires_at epoch, utc_day,
# baseline_neurons, exclusive_use=true, quota_db_path (exact shared path). No automatic plan upgrade.
# UTC days; failed/uncertain reservations survive midnight. Workers Free server hard stop prevents paid overage.

[contract]
environment = "production"           # Phase 2 build/test: set staging AND use the staging origins below.
media_origin = "https://vlink-storages-prod.sgp1.cdn.digitaloceanspaces.com" # Observed 2026-10-19; bind into authenticated verification report.
api_origin = "https://api.nailhub.ai"
site_origin = "https://nailhub.ai"
# staging pair: https://api-staging.nailhub.ai + https://staging.nailhub.ai
# All [links] must follow the selected site_origin. Never mix environments.
verified = false
verification_ref = ""                 # Required with verified=true before live.

[admin]
# Environment-bound login/probe work without enabling live or image generation.
# credential_file = "/etc/nailblog/private/staging-admin.json"  # {email,password}, service-owned 0600.
# profile_path = "/var/lib/agentfleet/nailblog-staging/browser" # Separate from all production/service profiles.
timeout_seconds = 30
headless = true
# daily_publish_limit = 1             # 1..number of service.slots, at most 3.
# publish_timeout_seconds = 300       # 60..900, per article.
# [admin.category_ids]                # category slug -> GUID observed from the selected admin environment; all 4 are needed for [autoflow].
# hot-trend = "00000000-0000-0000-0000-000000000000"
# nail-job = "00000000-0000-0000-0000-000000000000"
# nail-salon = "00000000-0000-0000-0000-000000000000"
# did-you-know = "00000000-0000-0000-0000-000000000000"

[console]
revision = ""

[trends]
# Google Trending RSS, geo US only (TD-8). The host is pinned; this is the only URL accepted.
rss_url = "https://trends.google.com/trending/rss?geo=US"
poll_hours = 3                        # snapshot every N hours (Vietnam clock: 00:00, 03:00, ...).
# Watched nail keywords: their trend score uses the daily frequency kept in trend_snapshots.
keywords = ["chrome nails", "cat eye nails", "velvet nails", "burgundy nails", "chocolate nails", "french tip nails",
            "halloween nails", "christmas nails", "thanksgiving nails", "winter nails", "glitter nails", "gel x",
            "builder gel", "nail art", "short nails", "almond nails", "square nails", "coffin nails", "aura nails",
            "jelly nails"]
# A Google trending item (or news title) is relevant only when it holds an anchor word, as a whole word in any case.
anchor_terms = ["nail", "nails", "manicure", "pedicure", "mani", "pedi", "nail art", "nail salon", "nail polish",
                "nail tech"]
# Context words never make an item relevant; they only label an item that already matched an anchor.
context_terms = ["polish", "gel", "acrylic", "chrome", "french tip", "cat eye", "salon", "beauty", "makeup", "glitter"]
api_enabled = false                   # Official Google Trends API (alpha): not implemented, true is refused.

[daily]
# Vietnam time. propose_at < pick_deadline < preview_at.
propose_at = "10:00"                  # trend table + 4 candidates for tomorrow (2 per slot).
pick_deadline = "13:00"               # /nailblog pick <06|19> <n> until here; then backlog or best candidate.
preview_at = "20:00"                  # DM with tomorrow's articles to approve.
# slot_categories: keys must equal service.slots. These are the defaults for slots 06:00 and 19:00.
# [daily.slot_categories]
# "06:00" = ["hot-trend", "nail-job"]
# "19:00" = ["nail-salon", "did-you-know"]

[links]
# Internal CTA targets of an article (https, nailhub.ai only). TODO Phase 0: the real URLs are not fixed yet.
jobs = "https://nailhub.ai/"          # cta.target = jobs: see job posts
salon_sale = "https://nailhub.ai/"    # cta.target = salon_sale: see salons for sale
app = "https://nailhub.ai/"           # cta.target = app: get the app

[autoflow]
# Unattended daily flow. enabled = true needs service.mode = live, image.provider = "gemini", image.key_source = "env"
# all four [admin.category_ids], contract.environment = "staging", budget.ledger_db_path, and
# admin.daily_publish_limit >= the number of service.slots.
enabled = false
# run_usd = 1.0                       # > 0 and <= budget.daily_usd; required when enabled.
# runs_dir = "/var/lib/agentfleet/nailblog/runs"   # absolute; required when enabled.
[subscription]
# Used only when image.provider = "subscription" (staging + review_bypass + candidates/max_rounds = 1).
# No API fallback or API key. Native CLI cover1376x768/body1200x675; no upscaling.
executable = "/snap/bin/agy"
version = "1.2.11"
agent_model = "gemini-3.8-flash-medium"
effort = "medium"
queue_dir = "/var/lib/nailblog-subscription/queue"
private_dir = "/home/startechai/snap/antigravity-cli/common/nailblog-worker"
worker_user = "startechai"
producer_user = "tgnailblog"
timeout_seconds = 240
max_daily_jobs = 24
max_images_per_run = 12               # <=6 positions + ONE explicit Owner rejection retry; never automatic retry
